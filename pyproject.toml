[build-system]
# scikit-build-core builds the optional C++/CUDA module bindoptix._core (stage Z11, like BWPM).
# Without a compiler: pip install . -C cmake.define.BINDOPTIX_BUILD_CORE=OFF (Python reference).
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "bindoptix"
version = "0.0.1"
description = "Time, transport and biology layer for optical biosensors"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "nurbforge>=0.6.0"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.24"
build-dir = "build/py-{wheel_tag}"
wheel.packages = ["src/bindoptix"]
sdist.exclude = ["build", "experiments/out", ".github"]

[tool.scikit-build.cmake.define]
BINDOPTIX_BUILD_CORE = "ON"
# CUDA backend on the large machine:
#   pip install -e . -C cmake.define.BINDOPTIX_ENABLE_CUDA=ON
BINDOPTIX_ENABLE_CUDA = "OFF"
# Python from (mini)conda with an older libstdc++ than the compiler ("GLIBCXX_… not found"):
#   pip install -e . -C cmake.define.BINDOPTIX_STATIC_LIBSTDCXX=ON
BINDOPTIX_STATIC_LIBSTDCXX = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = ["slow: expensive reference computation (pytest -m slow)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Nurbforge re-exports its compiled core without __all__; its API is untyped (Any) here.
module = ["nurbforge", "nurbforge.*"]
implicit_reexport = true
